services:
  web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
      target: build
    command: pnpm run dev --host 0.0.0.0
    volumes:
      - ./frontend-web:/app
      - /app/node_modules
    ports:
      - "3010:4321"
    environment:
      - NODE_ENV=development

  dashboard:
    build:
      context: ./frontend-app
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8001/api/v1
    ports:
      - "3011:80"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - NODE_ENV=development
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883

  db:
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

  mosquitto:
    image: docker.io/library/eclipse-mosquitto:2.0
    container_name: ad-mesh-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - ad-mesh-network
      - proxy-network