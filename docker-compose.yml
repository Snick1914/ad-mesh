services:
  sales:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: ad-mesh-sales
    restart: unless-stopped
    networks:
      - ad-mesh-network
      - proxy-network

  dashboard:
    build:
      context: ./frontend-app
      dockerfile: Dockerfile
    container_name: ad-mesh-dashboard
    restart: unless-stopped
    networks:
      - ad-mesh-network
      - proxy-network
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ad-mesh-api
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - ad-mesh-network
      - proxy-network

  db:
    image: postgres:16-alpine
    container_name: ad-mesh-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=admesh_db
    restart: unless-stopped
    volumes:
      - ad-mesh-db-data:/var/lib/postgresql/data
    networks:
      - ad-mesh-network

networks:
  ad-mesh-network:
    driver: bridge
  proxy-network:
    external: true

volumes:
  ad-mesh-db-data:
