name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /home/${{ secrets.SSH_USER }}
            
            # Si la carpeta no es un repositorio git, clonarlo
            if [ ! -d "ad-mesh/.git" ]; then
              rm -rf ad-mesh # Borrar la carpeta vacía si existe
              git clone https://github.com/Snick1914/ad-mesh.git ad-mesh
            fi
            
            cd ad-mesh
            git pull origin main
            
            # Crear archivo .env desde secretos de GitHub
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
            echo "POSTGRES_SERVER=db" >> .env
            echo "POSTGRES_USER=postgres" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "POSTGRES_DB=admesh_db" >> .env
            
            # Copiar a backend para compatibilidad
            cp .env backend/.env
            
            # Levantar contenedores
            docker-compose up -d --build
            
            # Limpiar imágenes antiguas
            docker image prune -f
