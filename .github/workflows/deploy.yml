name: Deploy to Production

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: snick1914/ad-mesh

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and Push Backend (API)
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-api:latest

      # Build and Push Dashboard
      - name: Build and push Dashboard
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-app
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-dashboard:latest

      # Build and Push Sales (Landing Page)
      - name: Build and push Sales
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-web
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-sales:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (to get docker-compose.yml)
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            mkdir -p /home/${{ secrets.SSH_USER }}/ad-mesh
            cd /home/${{ secrets.SSH_USER }}/ad-mesh
            
            # Crear archivo .env desde secretos de GitHub
            cat <<EOF > .env
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            POSTGRES_SERVER=db
            POSTGRES_USER=postgres
            POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}
            POSTGRES_DB=admesh_db
            EOF
            
            # Crear docker-compose.yml directamente (enviado desde GitHub)
            cat <<EOF > docker-compose.yml
            services:
              sales:
                image: ghcr.io/snick1914/ad-mesh-sales:latest
                container_name: ad-mesh-sales
                restart: unless-stopped
                networks:
                  - ad-mesh-network
                  - proxy-network

              dashboard:
                image: ghcr.io/snick1914/ad-mesh-dashboard:latest
                container_name: ad-mesh-dashboard
                restart: unless-stopped
                networks:
                  - ad-mesh-network
                  - proxy-network

              api:
                image: ghcr.io/snick1914/ad-mesh-api:latest
                container_name: ad-mesh-api
                restart: unless-stopped
                depends_on:
                  - db
                networks:
                  - ad-mesh-network
                  - proxy-network
                env_file:
                  - .env

              db:
                image: postgres:16-alpine
                container_name: ad-mesh-db
                environment:
                  - POSTGRES_USER=\${POSTGRES_USER}
                  - POSTGRES_PASSWORD=\${POSTGRES_PASSWORD}
                  - POSTGRES_DB=\${POSTGRES_DB}
                restart: unless-stopped
                volumes:
                  - ad-mesh-db-data:/var/lib/postgresql/data
                networks:
                  - ad-mesh-network

            networks:
              ad-mesh-network:
                driver: bridge
              proxy-network:
                external: true

            volumes:
              ad-mesh-db-data:
            EOF
            
            # Login al registro de GitHub en el servidor
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Descargar imágenes nuevas y levantar
            docker compose pull
            docker compose up -d
            
            # Limpiar
            docker image prune -f
