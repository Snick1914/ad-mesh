name: Deploy to Production

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: snick1914/ad-mesh

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and Push Backend (API)
      - name: Build and push Backend (API)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-api:latest

      # Build and Push App (Dashboard)
      - name: Build and push App
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-app
          push: true
          build-args: |
            VITE_API_URL=https://api.ad-mesh.com/api/v1
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-app:latest

      # Build and Push Web (Landing Page)
      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-web
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-web:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (to get docker-compose.yml)
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            mkdir -p /home/${{ secrets.SSH_USER }}/ad-mesh
            cd /home/${{ secrets.SSH_USER }}/ad-mesh
            
            # Crear archivo .env desde secretos de GitHub
            cat <<EOF > .env
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            POSTGRES_SERVER=db
            POSTGRES_USER=postgres
            POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}
            POSTGRES_DB=admesh_db
            BACKEND_CORS_ORIGINS=["https://app.ad-mesh.com","https://ad-mesh.com","http://localhost:5173","http://localhost:3000","http://localhost","https://localhost"]
            EOF
            
            # Crear docker-compose.yml directamente (actualizado con nuevos nombres)
            cat <<EOF > docker-compose.yml
            services:
              web:
                image: ghcr.io/snick1914/ad-mesh-web:latest
                container_name: ad-mesh-web
                restart: unless-stopped
                networks:
                  - ad-mesh-network
                  - proxy-network

              app:
                image: ghcr.io/snick1914/ad-mesh-app:latest
                container_name: ad-mesh-app
                restart: unless-stopped
                networks:
                  - ad-mesh-network
                  - proxy-network

              api:
                image: ghcr.io/snick1914/ad-mesh-api:latest
                container_name: ad-mesh-api
                restart: unless-stopped
                depends_on:
                  - db
                  - mosquitto
                networks:
                  - ad-mesh-network
                  - proxy-network
                env_file:
                  - .env
                volumes:
                  - ./media:/app/static/media

              mosquitto:
                image: eclipse-mosquitto:2.0
                container_name: ad-mesh-mqtt
                restart: unless-stopped
                volumes:
                  - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
                networks:
                  - ad-mesh-network

              db:
                image: postgres:16-alpine
                container_name: ad-mesh-db
                environment:
                  - POSTGRES_USER=\${POSTGRES_USER}
                  - POSTGRES_PASSWORD=\${POSTGRES_PASSWORD}
                  - POSTGRES_DB=\${POSTGRES_DB}
                restart: unless-stopped
                volumes:
                  - ad-mesh-db-data:/var/lib/postgresql/data
                networks:
                  - ad-mesh-network

            networks:
              ad-mesh-network:
                driver: bridge
              proxy-network:
                external: true

            volumes:
              ad-mesh-db-data:
            EOF

            # Crear mosquitto.conf si no existe
            if [ ! -f mosquitto.conf ]; then
              cat <<MQTTEOF > mosquitto.conf
            listener 1883
            allow_anonymous true
            persistence false
            MQTTEOF
            fi
            
            # Login al registro de GitHub en el servidor
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Descargar imágenes nuevas y levantar
            docker compose pull
            docker compose up -d --remove-orphans
            
            # Ejecutar migraciones de base de datos
            docker compose exec -T api alembic upgrade head
            
            # Limpiar imágenes huérfanas
            docker image prune -f
