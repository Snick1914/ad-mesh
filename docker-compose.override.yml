services:
  web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
      target: build
    command: pnpm run dev --host 0.0.0.0
    volumes:
      - ./frontend-web:/app
      - /app/node_modules
    ports:
      - "3010:4321"
    environment:
      - NODE_ENV=development

  dashboard:
    build:
      context: ./frontend-app
      dockerfile: Dockerfile
    ports:
      - "3011:80"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - NODE_ENV=development

  db:
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}